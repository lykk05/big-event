spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/big_event?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false"
    username: root
    password: ${DB_PWD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PWD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis:
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名和下划线命名的转换

jwt:
  # 必须通过环境变量提供，缺失时应用启动失败（不再使用硬编码默认值）
  key: ${JWT_KEY}
  ttl-hours: 2

ai:
  api:
    url: https://api.deepseek.com/chat/completions # deepseek的url
    key: ${DEEPSEEK_API_KEY}
    model: deepseek-v4-pro
    connect-timeout: 10000
    read-timeout: 30000
  rate-limit:
    daily: 50

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{40} - %msg%n"
